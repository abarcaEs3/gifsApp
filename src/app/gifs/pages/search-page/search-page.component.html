<nav class="mt-5">
  <h2 class="text-2xl font-bold tracking-tight text-base-content">
    Buscar Gifs
  </h2>
  <h3 class="mt-1 text-sm text-base-content/60">
    Buscar por nombre, descripción o tags
  </h3>
</nav>

<section class="mt-4">
  <input
    type="text"
    placeholder="Buscar Gifs"
    class="input input-bordered w-full max-w-md bg-base-100 text-base-content shadow-sm placeholder:text-base-content/40 sm:max-w-lg"
    (keyup.enter)="onSearch(txtSearch.value)"
    #txtSearch
  />
</section>

<main class="py-5">
  <app-gifs-list [gifs]="gifs()" />
</main>
