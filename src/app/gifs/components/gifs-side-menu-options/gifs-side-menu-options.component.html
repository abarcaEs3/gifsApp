<div id="nav" class="w-full px-4">
  @for (item of menuOptions; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-primary text-primary-content"
      class="inline-flex w-full items-center gap-3 rounded-lg border-b border-base-content/10 px-3 py-3 transition-colors duration-150 hover:bg-base-content/5"
    >
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-base-content/5">
        <i [class]="item.icon"></i>
      </div>

      <div class="flex flex-col">
        <span class="text-base font-semibold leading-5 text-base-content">
          {{ item.label }}
        </span>
        <span class="hidden text-sm text-base-content/50 md:block">
          {{ item.subLabel }}
        </span>
      </div>
    </a>
  }

  @for (key of gifsService.searchHistoryKeys(); track key) {
    <a
      [routerLink]="['/dashboard/history', key]"
      routerLinkActive="bg-primary text-primary-content"
      class="inline-flex w-full items-center gap-3 rounded-lg border-b border-base-content/10 px-3 py-3 transition-colors duration-150 hover:bg-base-content/5"
    >
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-base-content/5">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>

      <div class="flex flex-col">
        <span class="text-base font-semibold leading-5 text-base-content">
          {{ key }}
        </span>
      </div>
    </a>
  }
</div>
