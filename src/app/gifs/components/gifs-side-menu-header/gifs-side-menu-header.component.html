<div id="logo" class="my-4 px-6">
  <h1 class="text-lg md:text-2xl font-bold text-base-content tracking-tight">
    {{ env.companyName }}<span class="text-primary">{{ env.companyName2 }}</span>.
  </h1>
  <p class="text-base-content/60 text-sm mt-1">{{ env.companySlogan }}</p>
</div>

<div class="divider my-0 px-6 before:bg-base-content/10 after:bg-base-content/10"></div>

<div id="profile" class="px-6 py-6">
  <p class="text-base-content/60 text-sm mb-3">Bienvenido</p>
  <a href="#" class="flex items-center gap-3 p-2 -mx-2 rounded-lg hover:bg-base-200 transition-colors">
    <div class="avatar">
      <div class="w-10 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
        <img
          src="assets/img/avatar.png"
          alt="Avatar de usuario"
        />
      </div>
    </div>
    <span class="text-sm md:text-base font-bold text-base-content"> Carlos Abarca </span>
  </a>
</div>
